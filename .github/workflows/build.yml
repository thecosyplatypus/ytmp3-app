name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller yt-dlp PyQt6

      - name: Build YTMP3.exe
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name YTMP3 `
            --collect-all yt_dlp `
            --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.QtWebEngineWidgets `
            --exclude-module PyQt6.QtQuick `
            --exclude-module PyQt6.Qt3DCore `
            main.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: YTMP3
          path: dist/YTMP3.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YTMP3
          path: dist

      - name: Attach exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YTMP3.exe
          body: |
            Windows download: grab **YTMP3.exe** and run it. No Python install needed.
            Windows may show a "Windows protected your PC" blue screen - click
            **More info** then **Run anyway**.
